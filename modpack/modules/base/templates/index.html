<!doctype html>
<html>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
  <style>
    body {
      background-color: #F0F0F0;
      font: 1rem/1.4 -apple-system, BlinkMacSystemFont,
        Segoe UI, Roboto, Oxygen,
        Ubuntu, Cantarell, Fira Sans,
        Droid Sans, Helvetica Neue, sans-serif;
    }

    header {
      padding: 0.5em;
      background-color: rgba(255, 255, 255, 0.90);
    }

    #info {
      font-size: 1.25em;
      background-color: rgba(240, 240, 240, 0.5);
    }

    canvas {
      position: absolute;
      z-index: 0;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      margin: 0;
      touch-action: none;
    }

    #console {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 150px;
      overflow-y: scroll;
      background-color: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 4px;
      z-index: 9999;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <header></header>
    <p><span id="info"></span></p>
  </div>
  <div id="console"></div>

  <script src="/static/vendor/socket.io/socket.io.min.js"></script>
  <script type="text/javascript">
    // On-screen console
    (function () {
      const logDiv = document.getElementById('console');
      function formatArgs(args) {
        return args.map(arg => (typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg)).join(' ');
      }

      ['log', 'error', 'warn'].forEach(type => {
        const original = console[type];
        console[type] = function (...args) {
          original.apply(console, args);
          const line = document.createElement('div');
          line.style.color = type === 'log' ? '#0f0' : type === 'error' ? 'red' : 'yellow';
          line.textContent = formatArgs(args);
          logDiv.appendChild(line);
          logDiv.scrollTop = logDiv.scrollHeight;
        };
      });
    })();

    // Device ID
    let deviceId = localStorage.getItem('deviceId');
    if (!deviceId) {
      deviceId = Math.random().toString(36).substring(2, 15);
      localStorage.setItem('deviceId', deviceId);
    }
    console.log('Using device ID:', deviceId);
    // RTT tracking
    class RTTStats {
      constructor(bufferSize) {
        this.bufferSize = bufferSize;
        this.bufferIndex = 0;
        this.rttArray = new Array(bufferSize).fill(0);
      }
      calculate(rtt) {
        this.rttArray[this.bufferIndex] = rtt;
        this.bufferIndex = (this.bufferIndex + 1) % this.bufferSize;
        const minRtt = Math.min(...this.rttArray);
        const avgRtt = this.rttArray.reduce((a, b) => a + b, 0) / this.bufferSize;
        const maxRtt = Math.max(...this.rttArray);
        const stdDevRtt = Math.sqrt(this.rttArray.map(x => (x - avgRtt) ** 2).reduce((a, b) => a + b, 0) / this.bufferSize);
        return `${minRtt.toFixed(1)}/${avgRtt.toFixed(1)}/${maxRtt.toFixed(1)}/${stdDevRtt.toFixed(1)} ms`;
      }
    }
    const rttStats = new RTTStats(100);

    let robotBasePose = undefined;
    const socket = io();

    // Teleop state
    let teleopActive = false;

    socket.on('echo', timestamp => {
      const rtt = Date.now() - timestamp;
      document.getElementById('info').innerText = rttStats.calculate(rtt);
    });
    const teleopMode = 'base';

    let rezero = false;  // Store command from server

    socket.on('message', data => {
      console.log('Server message:', data);

      // Store any command/rezero flag
      if (data.rezero === true) {
        rezero = true;
        console.log('Rezero flag received, will attach to next frame');
      }

      if (data.episode_active !== undefined) {
        teleopActive = data.episode_active;
        console.log('Episode active:', teleopActive);
      }
    });

    // Keep base_pose route separate if you still need it for other purposes
    socket.on('base_pose', data => {
      robotBasePose = data.base_pose;
      console.log('Base pose updated:', robotBasePose);
    });

    // XR globals
    let xrButton = null;
    let xrRefSpace = null;
    let gl = null;
    let xrSession = null;
    let xrStartRequested = false;

    function initXR() {
      xrButton = document.createElement('button');
      xrButton.id = 'start-episode-fullscreen';
      xrButton.textContent = 'Tap to Start Episode';
      xrButton.onclick = onRequestSession;
      xrButton.style.position = 'fixed';
      xrButton.style.inset = '0';
      xrButton.style.width = '100vw';
      xrButton.style.height = '100vh';
      xrButton.style.zIndex = '10000';
      xrButton.style.border = '0';
      xrButton.style.fontSize = '2rem';
      xrButton.style.background = 'rgba(0,0,0,0.65)';
      xrButton.style.color = '#fff';
      xrButton.style.cursor = 'pointer';
      document.body.appendChild(xrButton);

      if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-ar').then(supported => {
          if (!supported) {
            xrButton.textContent = 'AR not supported on this device/browser';
            xrButton.disabled = true;
            return;
          }
          xrButton.textContent = 'Tap to Start Episode';
        });
      } else {
        xrButton.textContent = 'WebXR unavailable in this browser';
        xrButton.disabled = true;
      }
    }

    async function onRequestSession() {
      if (xrStartRequested || xrSession) return;
      if (!navigator.xr) return;
      xrStartRequested = true;
      try {
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.getElementById('overlay') }
        });
        if (xrButton) xrButton.style.display = 'none';

        xrSession.addEventListener('end', onEndSession);
        const canvas = document.createElement('canvas');
        gl = canvas.getContext('webgl', { xrCompatible: true });
        xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });
        xrRefSpace = await xrSession.requestReferenceSpace('local');
        xrSession.requestAnimationFrame(onXRFrame);
      } catch (err) {
        xrStartRequested = false;
        if (xrButton) {
          xrButton.disabled = false;
          xrButton.style.display = 'block';
          xrButton.textContent = 'Tap to Start Episode';
        }
        console.error('Failed to start XR session:', err);
      }
    }


    function onEndSession(session) {
      session.end();
      xrSession = null;
      xrStartRequested = false;
      if (xrButton) {
        xrButton.disabled = false;
        xrButton.style.display = 'block';
        xrButton.textContent = 'Tap to Start Episode';
      }

      // Let the server know user is ready for env reset
      const data = { timestamp: Date.now(), state_update: 'reset_env' };
      socket.send(data);
    }

    let zeroPosition = { x: 0, y: 0, z: 0 };
    let zeroOrientation = { x: 0, y: 0, z: 0, w: 1 };

    function onXRFrame(t, frame) {
      xrSession.requestAnimationFrame(onXRFrame);

      if (!gl) return;
      gl.clearColor(0, 0, 0, 0.5);
      gl.clear(gl.COLOR_BUFFER_BIT);

      if (!teleopActive) return;

      if (!xrRefSpace) return;
      const pose = frame.getViewerPose(xrRefSpace);
      if (!pose) return;

      const data = {
        timestamp: Date.now(),
        device_id: deviceId,
        teleop_mode: 'base'
      };

      data.position = {
        x: pose.transform.inverse.position.x,
        y: pose.transform.inverse.position.y,
        z: pose.transform.inverse.position.z
      };

      data.orientation = {
        x: pose.transform.inverse.orientation.x,
        y: pose.transform.inverse.orientation.y,
        z: pose.transform.inverse.orientation.z,
        w: pose.transform.inverse.orientation.w,
      };
      data.rezero = rezero;
      socket.send(data);
      rezero = false;
    }

    initXR();
  </script>
</body>

</html>
